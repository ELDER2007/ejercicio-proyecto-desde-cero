name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tallerya
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tallerya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tallerya" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: tallerya
      POSTGRES_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests (PostgreSQL real, incluye concurrencia)
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Contrato OpenAPI comprometido en el frontend = el del backend
        run: |
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > /tmp/openapi.json
          python3 - <<'PY'
          import json, sys
          a = json.load(open("/tmp/openapi.json")); b = json.load(open("../frontend/openapi.json"))
          sys.exit(0 if a == b else "frontend/openapi.json desactualizado: regenéralo (ver README) y ejecuta npm run api:types")
          PY
      - name: Migraciones sin desviaciones respecto a los modelos
        run: |
          uv run python - <<'PY'
          import os, psycopg
          s = os.environ
          with psycopg.connect(f"host=localhost user={s['POSTGRES_USER']} password={s['POSTGRES_PASSWORD']} dbname=postgres", autocommit=True) as c:
              c.execute("DROP DATABASE IF EXISTS drift_check")
              c.execute("CREATE DATABASE drift_check")
          PY
          POSTGRES_DB=drift_check uv run alembic upgrade head
          POSTGRES_DB=drift_check uv run alembic check

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tipos de la API regenerados coinciden con los comprometidos
        run: |
          npm run api:types
          git diff --exit-code lib/api-types.d.ts
      - run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8000

  security:
    name: Seguridad (dependencias y secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secretos en el repositorio y su historial (gitleaks, imagen oficial)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --verbose --no-banner
      - uses: astral-sh/setup-uv@v6
      - name: Dependencias Python (pip-audit)
        working-directory: backend
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependencias Node (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build + escaneo de imágenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: tallerya-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: tallerya-frontend:ci
      - name: Trivy (vulnerabilidades conocidas altas/críticas; los secretos los cubre gitleaks)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.2 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress tallerya-backend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.2 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress tallerya-frontend:ci
